<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Tactical FPS — CruiseBuilder Rolling-Car Chassis</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1917; color: #f5f1e8; font-family: 'Rajdhani', system-ui, -apple-system, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; inset: 0; pointer-events: none; }
    .topbar {
      position: absolute; top: 14px; left: 18px; right: 18px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .pill {
      background: rgba(20, 22, 26, 0.78); backdrop-filter: blur(8px);
      border: 1px solid rgba(245, 241, 232, 0.14); border-radius: 6px;
      padding: 6px 14px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
      display: flex; gap: 16px; align-items: center;
    }
    .accent { color: #f59e0b; font-weight: 700; }
    .muted { color: #a8a29e; }
    .bottom-left {
      position: absolute; bottom: 20px; left: 22px;
      display: flex; gap: 14px; align-items: flex-end;
    }
    .stat-box {
      background: rgba(20, 22, 26, 0.82); border-left: 3px solid #f59e0b;
      padding: 10px 18px; border-radius: 4px; min-width: 112px;
    }
    .stat-val { font-size: 32px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .stat-lbl { font-size: 11px; color: #a8a29e; letter-spacing: 0.12em; margin-top: 4px; }
    .bottom-right { position: absolute; bottom: 20px; right: 22px; text-align: right; }
    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 40px; height: 40px;
    }
    .ch-line { position: absolute; background: #22c55e; box-shadow: 0 0 2px #000; transition: transform 0.04s linear; }
    .ch-top { width: 2px; height: 8px; left: 19px; top: 8px; }
    .ch-bot { width: 2px; height: 8px; left: 19px; bottom: 8px; }
    .ch-left { height: 2px; width: 8px; top: 19px; left: 8px; }
    .ch-right { height: 2px; width: 8px; top: 19px; right: 8px; }
    .hitmarker {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(45deg);
      width: 18px; height: 18px; opacity: 0; transition: opacity 0.12s ease-out;
    }
    .hitmarker::before, .hitmarker::after {
      content: ''; position: absolute; background: #f59e0b;
    }
    .hitmarker::before { width: 18px; height: 2px; top: 8px; left: 0; }
    .hitmarker::after { width: 2px; height: 18px; left: 8px; top: 0; }
    .killfeed {
      position: absolute; top: 58px; right: 18px;
      display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    }
    .kf-item {
      background: rgba(20, 22, 26, 0.82); border-right: 3px solid #f59e0b;
      padding: 5px 12px; border-radius: 4px; font-size: 13px; letter-spacing: 0.04em;
    }
    .banner {
      position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 22, 26, 0.86); border: 1px solid rgba(245, 158, 11, 0.45);
      padding: 8px 18px; border-radius: 999px; font-size: 13px; letter-spacing: 0.06em;
      pointer-events: auto; cursor: pointer;
    }
    .banner.hidden { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.170.0"
      }
    }
  </script>
</head>
<body>
  <div class="hud">
    <div class="topbar">
      <div class="pill">
        <span class="accent">TACTICAL FPS CHASSIS</span>
        <span class="muted">CS2 COUNTER-STRAFE + HEADBOX RAYCAST</span>
      </div>
      <div class="pill">
        <span>KILLS <strong class="accent" id="kills">0</strong></span>
        <span>HS% <strong id="hsPct">0%</strong></span>
        <span>FPS <strong id="fps">60</strong></span>
      </div>
    </div>

    <div class="killfeed" id="killfeed"></div>

    <div class="crosshair" id="crosshair">
      <div class="ch-line ch-top" id="chT"></div>
      <div class="ch-line ch-bot" id="chB"></div>
      <div class="ch-line ch-left" id="chL"></div>
      <div class="ch-line ch-right" id="chR"></div>
    </div>
    <div class="hitmarker" id="hitmarker"></div>

    <div class="banner" id="lockBanner">CLICK ARENA TO LOCK AIM · WASD MOVE · SHIFT WALK · R RELOAD · LEFT-CLICK FIRE</div>

    <div class="bottom-left">
      <div class="stat-box">
        <div class="stat-val" id="hp">100</div>
        <div class="stat-lbl">HEALTH</div>
      </div>
      <div class="stat-box" style="border-left-color:#38bdf8;">
        <div class="stat-val" id="speed">0.0</div>
        <div class="stat-lbl">VEL M/S</div>
      </div>
    </div>

    <div class="bottom-right">
      <div class="stat-box" style="border-left:none; border-right:3px solid #f59e0b;">
        <div class="stat-val"><span id="ammo">30</span> <span class="muted" style="font-size:18px;">/ 90</span></div>
        <div class="stat-lbl">VANDAL-01 · SEMI/AUTO</div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // Renderer & Warm Muted Tactical Daylight Scene (CS2 Mirage / Dust2 readability discipline)
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#c8bfb0');
    scene.fog = new THREE.Fog('#c8bfb0', 38, 95);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.08, 160);
    const player = {
      pos: new THREE.Vector3(0, 1.65, 14),
      vel: new THREE.Vector3(),
      yaw: 0,
      pitch: -0.02,
      onGround: true,
      crouch: false,
      ammo: 30,
      reserve: 90,
      reloading: false,
      recoilPitch: 0,
      spread: 0,
      kills: 0,
      headshots: 0,
      fireCd: 0
    };
    camera.position.copy(player.pos);

    // Lighting: warm directional sun + cool sky hemisphere bounce
    const hemi = new THREE.HemisphereLight('#dbeafe', '#8c7a66', 0.95);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight('#fff2d6', 2.2);
    sun.position.set(18, 28, 14);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -28; sun.shadow.camera.right = 28;
    sun.shadow.camera.top = 28; sun.shadow.camera.bottom = -28;
    scene.add(sun);

    // Procedural subtle concrete grid texture (zero flat untextured plastic)
    function makeGridTex(base, line, repeat = 12) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = base; g.fillRect(0, 0, 256, 256);
      g.strokeStyle = line; g.lineWidth = 2;
      g.strokeRect(1, 1, 254, 254);
      for (let i = 0; i < 900; i++) {
        g.fillStyle = `rgba(0,0,0,${Math.random() * 0.045})`;
        g.fillRect(Math.random() * 256, Math.random() * 256, 3, 3);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeat, repeat);
      return tex;
    }

    const floorMat = new THREE.MeshStandardMaterial({ map: makeGridTex('#b8ad9c', '#9e9280', 18), roughness: 0.88, metalness: 0.04 });
    const wallMat = new THREE.MeshStandardMaterial({ map: makeGridTex('#cfc4b2', '#b5a894', 6), roughness: 0.92, metalness: 0.02 });
    const crateMat = new THREE.MeshStandardMaterial({ map: makeGridTex('#52606d', '#3e4c59', 2), roughness: 0.65, metalness: 0.25 });
    const accentCrateMat = new THREE.MeshStandardMaterial({ map: makeGridTex('#9a6b3f', '#7c532e', 2), roughness: 0.78, metalness: 0.08 });

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const colliders = [];
    function addBox(x, y, z, w, h, d, mat) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      colliders.push({ minX: x - w / 2 - 0.35, maxX: x + w / 2 + 0.35, minZ: z - d / 2 - 0.35, maxZ: z + d / 2 + 0.35 });
      return m;
    }

    // Perimeter courtyard walls
    addBox(0, 3, -24, 52, 6, 1.5, wallMat);
    addBox(0, 3, 24, 52, 6, 1.5, wallMat);
    addBox(-25, 3, 0, 1.5, 6, 48, wallMat);
    addBox(25, 3, 0, 1.5, 6, 48, wallMat);

    // Tactical cover lanes (Mid crate stack, left container, right head-glitch box)
    addBox(-7.5, 1.4, 2, 4.2, 2.8, 2.2, crateMat);
    addBox(7.2, 1.1, 0, 3.2, 2.2, 2.4, accentCrateMat);
    addBox(0, 0.75, -6, 3.6, 1.5, 1.6, accentCrateMat);
    addBox(-12, 1.6, -11, 2.6, 3.2, 6.0, crateMat);
    addBox(12.5, 1.6, -10, 2.6, 3.2, 5.5, crateMat);

    // Viewmodel rifle attached to camera
    const gunGroup = new THREE.Group();
    const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.11, 0.56), new THREE.MeshStandardMaterial({ color: '#27272a', roughness: 0.45, metalness: 0.65 }));
    const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.32, 10), new THREE.MeshStandardMaterial({ color: '#18181b', roughness: 0.35, metalness: 0.85 }));
    gunBarrel.rotation.x = Math.PI / 2;
    gunBarrel.position.set(0, 0.025, -0.36);
    const gunAccent = new THREE.Mesh(new THREE.BoxGeometry(0.084, 0.025, 0.18), new THREE.MeshStandardMaterial({ color: '#d97706', roughness: 0.5, metalness: 0.3 }));
    gunAccent.position.set(0, 0.04, -0.05);
    const muzzleFlash = new THREE.PointLight('#fbbf24', 0, 6);
    muzzleFlash.position.set(0, 0.03, -0.58);
    gunGroup.add(gunBody, gunBarrel, gunAccent, muzzleFlash);
    gunGroup.position.set(0.24, -0.22, -0.45);
    camera.add(gunGroup);
    scene.add(camera);

    // High-Contrast Dark Silhouette Bots (Head + Torso hitboxes)
    const bots = [];
    const hitMeshes = [];
    const bodyMat = new THREE.MeshStandardMaterial({ color: '#1f2937', roughness: 0.65, metalness: 0.15 });
    const headMat = new THREE.MeshStandardMaterial({ color: '#f59e0b', roughness: 0.45, metalness: 0.25 });

    function spawnBot(slot) {
      const g = new THREE.Group();
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 1.12, 0.36), bodyMat.clone());
      torso.position.y = 0.85;
      torso.castShadow = true;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 14, 14), headMat.clone());
      head.position.y = 1.62;
      head.castShadow = true;
      g.add(torso, head);

      const laneX = [-10, -4.5, 0, 4.8, 10.5][slot % 5];
      const laneZ = -12 - (slot % 3) * 3.5;
      g.position.set(laneX, 0, laneZ);
      scene.add(g);

      const bot = {
        group: g, torso, head, hp: 100, baseX: laneX,
        strafeAmp: 1.8 + (slot % 3) * 0.7,
        strafeSpeed: 1.2 + (slot % 4) * 0.35,
        phase: slot * 1.4,
        flashT: 0
      };
      torso.userData = { bot, zone: 'body' };
      head.userData = { bot, zone: 'head' };
      hitMeshes.push(torso, head);
      bots.push(bot);
    }
    for (let i = 0; i < 5; i++) spawnBot(i);

    // Bullet tracers
    const tracers = [];
    function spawnTracer(from, to) {
      const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
      const mat = new THREE.LineBasicMaterial({ color: '#fde68a', transparent: true, opacity: 0.9 });
      const line = new THREE.Line(geo, mat);
      scene.add(line);
      tracers.push({ line, life: 0.08 });
    }

    // Crisp WebAudio fallback transient (replaced by AssetWarehouse .ogg via @pixi/sound when stocked)
    let audioCtx = null;
    function playTone(freq, dur, gainVal, type = 'triangle') {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.25), audioCtx.currentTime + dur);
        g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch {}
    }

    // Input & PointerLock
    const keys = new Set();
    let firing = false;
    const banner = document.getElementById('lockBanner');
    function requestLock() { renderer.domElement.requestPointerLock?.(); }
    renderer.domElement.addEventListener('click', requestLock);
    banner.addEventListener('click', requestLock);
    document.addEventListener('pointerlockchange', () => {
      const locked = document.pointerLockElement === renderer.domElement;
      banner.classList.toggle('hidden', locked);
    });
    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== renderer.domElement) return;
      player.yaw -= e.movementX * 0.0021;
      player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch - e.movementY * 0.0021));
    });
    window.addEventListener('keydown', (e) => {
      keys.add(e.code);
      if (e.code === 'KeyR' && !player.reloading && player.ammo < 30 && player.reserve > 0) {
        player.reloading = true;
        setTimeout(() => {
          const need = Math.min(30 - player.ammo, player.reserve);
          player.ammo += need; player.reserve -= need; player.reloading = false;
        }, 700);
      }
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));
    window.addEventListener('mousedown', (e) => { if (e.button === 0) firing = true; });
    window.addEventListener('mouseup', (e) => { if (e.button === 0) firing = false; });

    const raycaster = new THREE.Raycaster();
    const hmEl = document.getElementById('hitmarker');
    const kfEl = document.getElementById('killfeed');
    let hmTimer = 0;

    function pushKillFeed(text) {
      const d = document.createElement('div');
      d.className = 'kf-item';
      d.textContent = text;
      kfEl.prepend(d);
      while (kfEl.children.length > 4) kfEl.lastChild.remove();
      setTimeout(() => d.remove(), 3500);
    }

    function shoot() {
      if (player.reloading || player.ammo <= 0 || player.fireCd > 0) return;
      player.ammo--;
      player.fireCd = 0.105; // ~570 RPM Vandal cadence
      muzzleFlash.intensity = 6;
      gunGroup.position.z = -0.38;
      playTone(170, 0.075, 0.14, 'sawtooth');

      const moveSpeed = Math.hypot(player.vel.x, player.vel.z);
      const totalSpread = (moveSpeed > 0.6 ? 0.028 : 0.002) + player.spread;
      const sx = (Math.random() - 0.5) * totalSpread;
      const sy = (Math.random() - 0.5) * totalSpread;

      raycaster.setFromCamera(new THREE.Vector2(sx, sy), camera);
      const hits = raycaster.intersectObjects(hitMeshes, false);
      const start = new THREE.Vector3(0.18, -0.14, -0.8).applyMatrix4(camera.matrixWorld);
      const end = hits.length > 0 ? hits[0].point : raycaster.ray.origin.clone().addScaledVector(raycaster.ray.direction, 45);
      spawnTracer(start, end);

      player.recoilPitch = Math.min(0.14, player.recoilPitch + 0.018);
      player.spread = Math.min(0.055, player.spread + 0.008);

      if (hits.length > 0) {
        const { bot, zone } = hits[0].object.userData;
        const dmg = zone === 'head' ? 100 : 34;
        bot.hp -= dmg;
        bot.flashT = 0.12;
        hmTimer = 0.14;
        hmEl.style.opacity = '1';
        playTone(zone === 'head' ? 1180 : 520, 0.06, 0.15, 'sine');

        if (bot.hp <= 0) {
          player.kills++;
          if (zone === 'head') player.headshots++;
          pushKillFeed(zone === 'head' ? 'YOU [HEADSHOT] TARGET BOT' : 'YOU [ELIM] TARGET BOT');
          bot.hp = 100;
          bot.baseX = (Math.random() - 0.5) * 24;
          bot.group.position.z = -10 - Math.random() * 10;
        }
      }
    }

    // Main Fixed-Feel Loop
    let last = performance.now();
    let fpsFrames = 0, fpsAcc = 0;
    function tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;

      // CS2 Counter-Strafe Movement Physics
      const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
      const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
      const wish = new THREE.Vector3();
      if (keys.has('KeyW')) wish.add(forward);
      if (keys.has('KeyS')) wish.sub(forward);
      if (keys.has('KeyD')) wish.add(right);
      if (keys.has('KeyA')) wish.sub(right);
      if (wish.lengthSq() > 0) wish.normalize();

      const maxSpeed = keys.has('ShiftLeft') ? 2.8 : keys.has('ControlLeft') ? 2.4 : 6.2;
      const accel = player.onGround ? 44 : 10;
      const friction = player.onGround ? 11.5 : 0.6;

      player.vel.x -= player.vel.x * Math.min(1, friction * dt);
      player.vel.z -= player.vel.z * Math.min(1, friction * dt);
      player.vel.x += wish.x * accel * dt;
      player.vel.z += wish.z * accel * dt;
      const horiz = Math.hypot(player.vel.x, player.vel.z);
      if (horiz > maxSpeed) {
        player.vel.x = (player.vel.x / horiz) * maxSpeed;
        player.vel.z = (player.vel.z / horiz) * maxSpeed;
      }

      if (keys.has('Space') && player.onGround) {
        player.vel.y = 6.8;
        player.onGround = false;
      }
      player.vel.y -= 19.5 * dt;

      const nx = Math.max(-23.5, Math.min(23.5, player.pos.x + player.vel.x * dt));
      const nz = Math.max(-22.5, Math.min(22.5, player.pos.z + player.vel.z * dt));
      let blockedX = false, blockedZ = false;
      for (const c of colliders) {
        if (nx > c.minX && nx < c.maxX && player.pos.z > c.minZ && player.pos.z < c.maxZ) blockedX = true;
        if (player.pos.x > c.minX && player.pos.x < c.maxX && nz > c.minZ && nz < c.maxZ) blockedZ = true;
      }
      if (!blockedX) player.pos.x = nx; else player.vel.x = 0;
      if (!blockedZ) player.pos.z = nz; else player.vel.z = 0;

      player.pos.y += player.vel.y * dt;
      const eyeH = keys.has('ControlLeft') ? 1.15 : 1.65;
      if (player.pos.y <= eyeH) { player.pos.y = eyeH; player.vel.y = 0; player.onGround = true; }

      // Recoil & weapon recovery
      player.fireCd = Math.max(0, player.fireCd - dt);
      if (firing) shoot();
      player.recoilPitch = Math.max(0, player.recoilPitch - 0.24 * dt);
      player.spread = Math.max(0, player.spread - 0.08 * dt);
      muzzleFlash.intensity = Math.max(0, muzzleFlash.intensity - 70 * dt);
      gunGroup.position.z += (-0.45 - gunGroup.position.z) * Math.min(1, 18 * dt);

      camera.position.copy(player.pos);
      camera.rotation.order = 'YXZ';
      camera.rotation.y = player.yaw;
      camera.rotation.x = Math.max(-1.45, Math.min(1.45, player.pitch + player.recoilPitch));

      // Bots strafe & flash
      const tSec = now * 0.001;
      for (const b of bots) {
        b.group.position.x = b.baseX + Math.sin(tSec * b.strafeSpeed + b.phase) * b.strafeAmp;
        if (b.flashT > 0) {
          b.flashT -= dt;
          b.torso.material.emissive.setHex(0xd97706);
        } else {
          b.torso.material.emissive.setHex(0x000000);
        }
      }

      // Tracers fade
      for (let i = tracers.length - 1; i >= 0; i--) {
        tracers[i].life -= dt;
        tracers[i].line.material.opacity = Math.max(0, tracers[i].life / 0.08);
        if (tracers[i].life <= 0) {
          scene.remove(tracers[i].line);
          tracers.splice(i, 1);
        }
      }

      // Dynamic crosshair bloom
      const gap = Math.round(Math.min(14, horiz * 1.4 + player.spread * 220));
      document.getElementById('chT').style.transform = `translateY(${-gap}px)`;
      document.getElementById('chB').style.transform = `translateY(${gap}px)`;
      document.getElementById('chL').style.transform = `translateX(${-gap}px)`;
      document.getElementById('chR').style.transform = `translateX(${gap}px)`;
      if (hmTimer > 0) { hmTimer -= dt; if (hmTimer <= 0) hmEl.style.opacity = '0'; }

      // HUD telemetry
      document.getElementById('ammo').textContent = player.reloading ? 'RLD' : String(player.ammo);
      document.getElementById('speed').textContent = horiz.toFixed(1);
      document.getElementById('kills').textContent = String(player.kills);
      document.getElementById('hsPct').textContent = player.kills ? `${Math.round((player.headshots / player.kills) * 100)}%` : '0%';

      fpsFrames++; fpsAcc += dt;
      if (fpsAcc >= 0.5) {
        document.getElementById('fps').textContent = String(Math.round(fpsFrames / fpsAcc));
        fpsFrames = 0; fpsAcc = 0;
      }

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    requestAnimationFrame(tick);
  </script>

<script>
  window.__bootErrors = [];
  window.addEventListener('error', (e) => {
    window.__bootErrors.push(e.message || 'runtime_error');
    document.documentElement.setAttribute('data-boot-errors', window.__bootErrors.join('||'));
  });
  window.addEventListener('load', () => {
    document.documentElement.setAttribute('data-boot-errors', window.__bootErrors.join('||'));
    document.documentElement.setAttribute('data-boot-status', 'READY');
  });
</script>
</body>
</html>
